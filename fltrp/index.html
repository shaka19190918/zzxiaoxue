(function(){ var s=document.getElementById('stars'),h=''; for(var i=0;i<110;i++){ var sz=(Math.random()*2+1).toFixed(1); h+='<div style="position:absolute;left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+'%;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:rgba(255,255,255,'+(Math.random()*.5+.3).toFixed(2)+');box-shadow:0 0 '+(sz*2)+'px rgba(180,210,255,.7);"></div>'; } s.innerHTML=h; })();

var N=KNOWLEDGE.length;
document.getElementById('cnt').textContent=N;

var spin=document.getElementById('spin');
var nodeEls=[];
var R=150, VSTEP=22, TURN=0.62;   /* 每节点绕轴角度(弧度) ≈ 35.5° */
var yMax=(N-1)/2*VSTEP;
var Rmax=Math.sqrt(R*R+yMax*yMax);

/* 中心光柱高度 = 螺旋总高 + 留白 */
document.getElementById('core').style.height=(yMax*2+70)+'px';

KNOWLEDGE.forEach(function(k,i){
  var t=i;                       /* 索引进螺旋 */
  var ang=t*TURN;
  var y=(i-(N-1)/2)*VSTEP;
  var x=Math.cos(ang)*R;
  var z=Math.sin(ang)*R;
  var el=document.createElement('div');
  el.className='node';
  el.innerHTML='<div class="ball"></div><div class="label">'+k.title+'</div>';
  el.style.setProperty('--mc',k.mc);
  el.querySelector('.ball').style.background='radial-gradient(circle at 33% 30%, '+k.ml+', '+k.mc+' 60%, '+k.md+')';
  el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,'+z.toFixed(1)+'px)';
  spin.appendChild(el);
  nodeEls.push({el:el,k:k,x:x,y:y,z:z,lab:el.querySelector('.label'),hover:false});
});

/* tooltip */
var tip=document.getElementById('tooltip'), cur=null;
nodeEls.forEach(function(n){
  n.el.addEventListener('mouseenter',function(e){cur=n;show(e,n);tip.style.opacity=1;});
  n.el.addEventListener('mousemove',function(e){if(cur===n)show(e,n);});
  n.el.addEventListener('mouseleave',function(){tip.style.opacity=0;cur=null;});
});
function show(e,n){
  tip.innerHTML='<div class="t-name">'+n.k.title+'</div><div class="t-mod">'+(n.k.vol==='A'?'一年级上册':'一年级下册')+' · '+n.k.module+'</div><div class="t-go">➜ 点击打开国家平台 · '+n.k.module+' 课时讲解</div>';
  var xx=e.clientX+16, yy=e.clientY-8;
  if(xx+tip.offsetWidth>window.innerWidth-8) xx=e.clientX-tip.offsetWidth-16;
  if(yy+tip.offsetHeight>window.innerHeight-8) yy=window.innerHeight-tip.offsetHeight-8;
  tip.style.left=xx+'px'; tip.style.top=yy+'px';
}
var dragMoved=false;
nodeEls.forEach(function(n){ n.el.addEventListener('click',function(){ if(dragMoved){dragMoved=false;return;} window.open(n.k.url,'_blank'); }); });

/* 旋转：慢速摆荡 + 拖拽 + billboard + 深度淡出 */
var stage=document.getElementById('stage');
var ry=-24, rx=-6, ryBase=-24, rxBase=-6, auto=true, dragging=false;
var lx=0,ly=0,dx0=0,dy0=0, swingT=0, lastTs=0, idleTimer=null, lastTap=0;
var SW_Y_AMP=16, SW_Y_T=42, SW_X_AMP=3, SW_X_T=28;
var LAB_ON=0.55, LAB_FULL=0.70;
var lastRy=1e9, lastRx=1e9;

function apply(){
  if(Math.abs(ry-lastRy)<0.04 && Math.abs(rx-lastRx)<0.04) return;
  lastRy=ry; lastRx=rx;
  var t='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
  spin.style.transform=t;
  var bt='translateX(-50%) rotateY('+(-ry).toFixed(2)+'deg) rotateX('+(-rx).toFixed(2)+'deg)';
  var crx=rx*Math.PI/180, cry=ry*Math.PI/180;
  var cy=Math.cos(cry), sy=Math.sin(cry), cx=Math.cos(crx), sx=Math.sin(crx);
  for(var i=0;i<nodeEls.length;i++){
    var n=nodeEls[i];
    var z1=-n.x*sy+n.z*cy;
    var z2=n.y*sx+z1*cx;
    var o=(z2+Rmax)/(2*Rmax); if(o<0)o=0; else if(o>1)o=1;
    n.el.style.opacity=(0.18+0.82*Math.pow(o,1.5)).toFixed(3);
    var lo=(o-LAB_ON)/(LAB_FULL-LAB_ON); if(lo<0)lo=0; else if(lo>1)lo=1;
    if(n.hover) lo=1;
    n.lab.style.opacity=lo.toFixed(3);
    if(lo>0.001) n.lab.style.transform=bt;
  }
}
function swing(now){
  var dt=lastTs?Math.min(0.05,(now-lastTs)/1000):0; lastTs=now;
  if(auto&&!dragging){ swingT+=dt; ry=ryBase+Math.sin(swingT*(2*Math.PI/SW_Y_T))*SW_Y_AMP; rx=rxBase+Math.sin(swingT*(2*Math.PI/SW_X_T))*SW_X_AMP; apply(); }
  requestAnimationFrame(swing);
}
function beginDrag(x,y){ dragging=true; auto=false; clearTimeout(idleTimer); lx=x; ly=y; dx0=x; dy0=y; stage.classList.add('dragging'); }
function moveDrag(x,y){ if(!dragging)return; if(Math.abs(x-dx0)+Math.abs(y-dy0)>5)dragMoved=true; ryBase+=(x-lx)*0.32; rxBase+=(y-ly)*0.22; if(rxBase>85)rxBase=85; else if(rxBase<-85)rxBase=-85; ry=ryBase; rx=rxBase; lx=x; ly=y; apply(); }
function endDrag(){ if(!dragging)return; dragging=false; stage.classList.remove('dragging'); clearTimeout(idleTimer); idleTimer=setTimeout(function(){swingT=0;auto=true;},5000); }
stage.addEventListener('mousedown',function(e){ dragMoved=false; if(e.target.closest('.node'))return; beginDrag(e.clientX,e.clientY); });
window.addEventListener('mousemove',function(e){moveDrag(e.clientX,e.clientY);});
window.addEventListener('mouseup',endDrag);
stage.addEventListener('touchstart',function(e){ dragMoved=false; if(e.target.closest('.node'))return; var tt=e.touches[0]; beginDrag(tt.clientX,tt.clientY); },{passive:true});
window.addEventListener('touchmove',function(e){ if(!dragging)return; var tt=e.touches[0]; moveDrag(tt.clientX,tt.clientY); e.preventDefault(); },{passive:false});
window.addEventListener('touchend',function(e){ if(!dragMoved){ var now=Date.now(); if(now-lastTap<330){resetView();lastTap=0;} else lastTap=now; } endDrag(); },{passive:true});
window.addEventListener('touchcancel',endDrag);
function resetView(){ ryBase=-24; rxBase=-6; swingT=0; auto=true; clearTimeout(idleTimer); ry=ryBase; rx=rxBase; lastRy=1e9; apply(); }
stage.addEventListener('dblclick',resetView);
nodeEls.forEach(function(n){ n.el.addEventListener('mouseenter',function(){n.hover=true;lastRy=1e9;apply();}); n.el.addEventListener('mouseleave',function(){n.hover=false;lastRy=1e9;apply();}); });

/* 自适应布局 */
var sceneEl=document.getElementById('scene'), legendEl=document.getElementById('legend');
function layout(){
  var w=window.innerWidth, h=window.innerHeight;
  var legendW=(getComputedStyle(legendEl).display==='none')?0:legendEl.offsetWidth;
  var shift=-legendW/2;
  var hudH=(h<700)?88:112;
  var margin=16, labelHalfW=58, labelBelow=30;
  var availHalfW=(w-legendW)/2 - margin - labelHalfW;
  var availHalfH=(h-hudH)/2 - margin - labelBelow;
  var sByW=availHalfW/(R+labelHalfW);
  var sByH=availHalfH/(yMax+labelBelow+10);
  var s=Math.min(sByW,sByH); if(s>1)s=1; if(s<0.3)s=0.3;
  sceneEl.style.transform='translateX('+shift.toFixed(1)+'px) scale('+s.toFixed(3)+')';
}
layout(); apply(); requestAnimationFrame(swing);
var rzT=null;
function relayout(){ clearTimeout(rzT); rzT=setTimeout(function(){layout();lastRy=1e9;apply();},100); }
window.addEventListener('resize',relayout);
window.addEventListener('orientationchange',function(){clearTimeout(rzT);rzT=setTimeout(function(){layout();lastRy=1e9;apply();},300);});
if(window.visualViewport) window.visualViewport.addEventListener('resize',relayout);

/* 图例：册次 → Module → 课节 */
(function(){
  var body=document.getElementById('legendBody'), html='';
  ['A','B'].forEach(function(vol){
    html+='<div class="lg-vol">'+(vol==='A'?'一年级 · 上册':'一年级 · 下册')+'</div>';
    var seen=[], map={};
    KNOWLEDGE.forEach(function(k){ if(k.vol!==vol)return; if(!map[k.module]){map[k.module]=[];seen.push(k.module);} map[k.module].push(k); });
    seen.forEach(function(mod,mi){
      var lessons=map[mod];
      html+='<div class="lg-mod" data-t="'+vol+mi+'"><span class="lg-dot" style="background:'+lessons[0].mc+'"></span>'+mod+' <span style="color:rgba(255,255,255,.45);font-size:11px">('+lessons.length+')</span><span class="lg-caret">▸</span></div>';
      html+='<div class="lg-lessons" id="lg-'+vol+mi+'">';
      lessons.forEach(function(k,li){ html+='<div class="lg-lesson" data-u="'+k.url+'">'+(li+1)+'. '+k.title+'</div>'; });
      html+='</div>';
    });
  });
  body.innerHTML=html;
  body.querySelectorAll('.lg-mod').forEach(function(el){ el.addEventListener('click',function(){ var box=document.getElementById('lg-'+el.dataset.t); var open=box.classList.toggle('open'); el.querySelector('.lg-caret').style.transform=open?'rotate(90deg)':''; }); });
  body.querySelectorAll('.lg-lesson').forEach(function(el){ el.addEventListener('click',function(){window.open(el.dataset.u,'_blank');}); });
})();
</script>
</body>
