<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>外研社英语 · 一年级互动学堂</title>
<style>
:root{--pri:#4FC3F7;--pri-d:#0288D1;--pri-l:#E3F2FD;--accent:#FFD567;--accent-d:#FFA726;--bg:#F0F8FF;--card:#FFF;--txt:#1A237E;--tx2:#5C6BC0;--good:#69C98C;--bad:#EF5350;--r:20px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(120deg,#4FC3F7,#29B6F6);padding:12px 18px;padding-top:max(12px,var(--st));display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(2,136,209,.25)}
.hdr .back{font-size:20px;color:#FFF;cursor:pointer;text-decoration:none;padding:4px 8px;border-radius:8px;transition:background .15s}
.hdr .back:hover{background:rgba(255,255,255,.2)}
.hdr h1{font-size:17px;font-weight:800;color:#FFF;letter-spacing:.5px;flex:1;text-align:center}
.hdr .stars{font-size:14px;color:#FFF;font-weight:700;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:16px;white-space:nowrap}
.main{padding:14px 16px;padding-bottom:calc(60px+var(--sb));flex:1}
/* Module selector */
.mod-bar{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 10px;scrollbar-width:thin}
.mod-bar::-webkit-scrollbar{height:4px}
.mod-bar::-webkit-scrollbar-thumb{background:var(--pri);border-radius:2px}
.mod-tab{flex:0 0 auto;padding:8px 14px;border-radius:14px;border:2px solid #E0E0E0;background:#FFF;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;color:var(--tx2)}
.mod-tab.on{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;border-color:transparent;box-shadow:0 3px 10px rgba(2,136,209,.3)}
.mod-tab .star{color:var(--accent-d)}
/* Welcome / hero */
.hero{background:linear-gradient(135deg,var(--pri),var(--pri-d));border-radius:var(--r);padding:22px 20px;color:#FFF;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h2{font-size:20px;margin-bottom:6px;position:relative;z-index:1}
.hero p{font-size:13px;opacity:.9;position:relative;z-index:1}
.hero .emoji-row{font-size:32px;margin-top:8px;position:relative;z-index:1}
/* Section title */
.sect-t{font-size:14px;font-weight:800;color:var(--tx2);margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sect-t .ic{font-size:18px}
/* Vocab cards */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vc{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.vc:active{transform:scale(.93)}
.vc.playing{border-color:var(--pri);background:var(--pri-l);box-shadow:0 4px 14px rgba(79,195,247,.3)}
.vc .vc-em{font-size:40px;line-height:1;margin-bottom:6px}
.vc .vc-en{font-size:16px;font-weight:800;color:var(--pri-d)}
.vc .vc-cn{font-size:12px;color:var(--tx2);margin-top:2px}
.vc .vc-spk{font-size:11px;color:var(--pri);margin-top:4px;opacity:.6}
/* Sentence cards */
.sent-list{display:flex;flex-direction:column;gap:8px}
.sc{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .15s}
.sc:active{transform:scale(.98)}
.sc.playing{box-shadow:0 4px 14px rgba(79,195,247,.25);background:var(--pri-l)}
.sc .sc-ic{font-size:22px;flex-shrink:0}
.sc .sc-en{font-size:15px;font-weight:700;flex:1}
.sc .sc-cn{font-size:12px;color:var(--tx2)}
.sc .sc-spk{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
/* Game area */
.game-box{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:14px}
.game-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.game-hd h3{font-size:16px;font-weight:800}
.game-hd .score{font-size:14px;font-weight:700;color:var(--accent-d)}
.game-q{font-size:18px;font-weight:700;text-align:center;margin-bottom:14px;color:var(--txt)}
.game-q .big-em{font-size:56px;display:block;margin-bottom:6px}
.game-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gopt{padding:16px 10px;border-radius:14px;border:3px solid #E0E0E0;background:#FFF;font-size:16px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;min-height:64px;display:flex;align-items:center;justify-content:center}
.gopt:active{transform:scale(.93)}
.gopt.right{background:linear-gradient(135deg,#69C98C,#4CAF50);color:#FFF;border-color:transparent;animation:pop .3s ease}
.gopt.wrong{background:linear-gradient(135deg,#EF5350,#E53935);color:#FFF;border-color:transparent;animation:shake .3s ease}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.game-fb{text-align:center;font-size:14px;font-weight:700;margin-top:10px;min-height:20px}
.game-fb.good{color:var(--good)}
.game-fb.bad{color:var(--bad)}
.game-next{margin-top:10px;text-align:center}
.game-next .btn{display:inline-block;padding:10px 28px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;font-size:14px;font-weight:700;cursor:pointer;border:none}
.game-next .btn:active{transform:scale(.95)}
/* Listen game specific */
.lg-play{margin:0 auto 16px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;box-shadow:0 6px 20px rgba(2,136,209,.3);transition:transform .15s}
.lg-play:active{transform:scale(.9)}
.lg-play.playing{animation:pulse-blue 1s ease-in-out infinite}
@keyframes pulse-blue{0%,100%{box-shadow:0 6px 20px rgba(2,136,209,.3)}50%{box-shadow:0 6px 30px rgba(2,136,209,.6)}}
/* Progress */
.prog-box{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:14px}
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.prog-row .pl{font-size:13px;font-weight:700;color:var(--tx2)}
.prog-row .pv{font-size:13px;font-weight:800;color:var(--pri-d)}
.prog-bar{height:10px;background:#E0E0E0;border-radius:5px;overflow:hidden}
.prog-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri-d));border-radius:5px;transition:width .4s}
/* 3D spiral toggle */
.spiral-toggle{text-align:center;margin:10px 0}
.spiral-toggle .btn{display:inline-block;padding:8px 20px;border-radius:12px;background:#FFF;border:2px solid var(--pri);color:var(--pri-d);font-size:13px;font-weight:700;cursor:pointer}
.spiral-toggle .btn:active{transform:scale(.95)}
#spiralBox{display:none;margin-bottom:14px;border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#spiralBox.show{display:block}
#spiralFrame{width:100%;height:420px;border:none}
/* Nav links */
.nav-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.nav-links a{text-align:center;padding:10px 6px;border-radius:12px;background:var(--card);font-size:12px;font-weight:700;text-decoration:none;color:var(--pri-d);box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .15s}
.nav-links a:active{transform:scale(.95)}
/* Responsive */
@media(max-width:700px){.vocab-grid{grid-template-columns:repeat(2,1fr)}.game-opts{grid-template-columns:repeat(2,1fr)}#app{max-width:100%}.hdr h1{font-size:15px}.nav-links{grid-template-columns:1fr}}
@media(min-width:701px){.vocab-grid{grid-template-columns:repeat(4,1fr)}.game-opts{grid-template-columns:repeat(4,1fr)}}
@media(orientation:landscape) and (max-height:560px){.hero{padding:14px 18px}.hero h2{font-size:17px}.hero .emoji-row{font-size:24px}.vc .vc-em{font-size:32px}.vc .vc-en{font-size:14px}#spiralFrame{height:300px}.hdr{padding:8px 14px}.hdr h1{font-size:15px}.main{padding:10px 14px;padding-bottom:40px}}
</style>
</head>

{en:"Where's the bird?",cn:"鸟在哪里？",ic:"🐦"},
{en:"It's red.",cn:"它是红色的。",ic:"🔴"},
{en:"That is my father.",cn:"那是我的爸爸。",ic:"👨"}
]},
{name:"Project",title:"Numbers & Things We Like",vol:"AB",emoji:"🔢",vocab:[
{em:"1️⃣",en:"one",cn:"一"},{em:"2️⃣",en:"two",cn:"二"},
{em:"3️⃣",en:"three",cn:"三"},{em:"4️⃣",en:"four",cn:"四"},
{em:"5️⃣",en:"five",cn:"五"},{em:"⚽",en:"football",cn:"足球"},
{em:"🏀",en:"basketball",cn:"篮球"}],
sents:[
{en:"How old are you? I'm five.",cn:"你几岁了？我五岁了。",ic:"5️⃣"},
{en:"I like football.",cn:"我喜欢足球。",ic:"⚽"},
{en:"One, two, three!",cn:"一，二，三！",ic:"🔢"},
{en:"Things we like.",cn:"我们喜欢的东西。",ic:"❤️"}
]}
];

/* === State === */
var state={modIdx:0,learned:new Set(),lgScore:0,pgScore:0,lgQ:0,pgQ:0};
try{var s=JSON.parse(localStorage.getItem('fltrp_v2')||'{}');if(s.modIdx!==undefined)state.modIdx=s.modIdx;if(s.learned)state.learned=new Set(s.learned);if(s.lgScore)state.lgScore=s.lgScore;if(s.pgScore)state.pgScore=s.pgScore;}catch(e){}

function save(){localStorage.setItem('fltrp_v2',JSON.stringify({modIdx:state.modIdx,learned:[...state.learned],lgScore:state.lgScore,pgScore:state.pgScore}));}

/* === TTS === */
var synth=window.speechSynthesis||null;
function speak(text,lang){
  if(!synth)return;
  try{synth.cancel()}catch(e){}
  var u=new SpeechSynthesisUtterance(text);
  u.lang=lang||'en-US';
  u.rate=0.8;
  u.pitch=1.1;
  synth.speak(u);
}

/* === Render === */
function curMod(){return MODULES[state.modIdx];}

function renderModBar(){
  var bar=document.getElementById('modBar');
  bar.innerHTML='';
  MODULES.forEach(function(m,i){
    var t=document.createElement('div');
    t.className='mod-tab'+(i===state.modIdx?' on':'');
    var learnedInMod=m.vocab.filter(function(v){return state.learned.has(v.en);}).length;
    var total=m.vocab.length;
    var star=learnedInMod>=total?' ★':'';
    t.innerHTML=m.name+(star?'<span class="star">★</span>':'');
    t.addEventListener('click',function(){state.modIdx=i;save();renderAll();});
    bar.appendChild(t);
  });
}

function renderHero(){
  var m=curMod();
  document.getElementById('heroTitle').textContent=m.name+'：'+m.title;
  var volStr=m.vol==='A'?'一年级上册':(m.vol==='B'?'一年级下册':'上下册');
  document.getElementById('heroDesc').textContent=volStr+' · '+m.vocab.length+' 个单词 · '+m.sents.length+' 个句型 · 点击卡片听发音';
  document.querySelector('.hero .emoji-row').textContent=m.emoji+' '+m.vocab.slice(0,4).map(function(v){return v.em;}).join('');
}

function renderVocab(){
  var m=curMod();
  var grid=document.getElementById('vocabGrid');
  grid.innerHTML='';
  m.vocab.forEach(function(v){
    var c=document.createElement('div');
    c.className='vc';
    var learned=state.learned.has(v.en);
    c.innerHTML='<div class="vc-em">'+v.em+'</div><div class="vc-en">'+v.en+'</div><div class="vc-cn">'+v.cn+'</div><div class="vc-spk">🔊 点击播放</div>';
    c.addEventListener('click',function(){
      document.querySelectorAll('.vc.playing').forEach(function(el){el.classList.remove('playing');});
      c.classList.add('playing');
      speak(v.en);
      state.learned.add(v.en);
      save();
      setTimeout(function(){c.classList.remove('playing');},1500);
      renderProgress();
      renderModBar();
    });
    grid.appendChild(c);
  });
}

function renderSents(){
  var m=curMod();
  var list=document.getElementById('sentList');
  list.innerHTML='';
  m.sents.forEach(function(s){
    var c=document.createElement('div');
    c.className='sc';
    c.innerHTML='<span class="sc-ic">'+s.ic+'</span><div><div class="sc-en">'+s.en+'</div><div class="sc-cn">'+s.cn+'</div></div><span class="sc-spk">🔊</span>';
    c.addEventListener('click',function(){
      document.querySelectorAll('.sc.playing').forEach(function(el){el.classList.remove('playing');});
      c.classList.add('playing');
      speak(s.en);
      setTimeout(function(){c.classList.remove('playing');},2000);
    });
    list.appendChild(c);
  });
}

/* === Game 1: See image, pick English word === */
function lgNewQ(){
  var m=curMod();
  var pool=m.vocab.slice();
  if(pool.length<2)return;
  var correct=pool[Math.floor(Math.random()*pool.length)];
  var wrongs=pool.filter(function(v){return v.en!==correct.en;}).sort(function(){return Math.random()-0.5;}).slice(0,3);
  if(wrongs.length<3){
    // fill from other modules
    var extra=[];
    MODULES.forEach(function(mod){if(mod===m)return;mod.vocab.forEach(function(v){if(pool.indexOf(v)<0)extra.push(v);});});
    extra=extra.sort(function(){return Math.random()-0.5;});
    while(wrongs.length<3&&extra.length>0)wrongs.push(extra.shift());
  }
  var opts=[correct].concat(wrongs).sort(function(){return Math.random()-0.5;});
  document.getElementById('lgEm').textContent=correct.em;
  document.getElementById('lgQ').innerHTML='<span class="big-em">'+correct.em+'</span>这是哪个单词？';
  speak(correct.en);
  var box=document.getElementById('lgOpts');
  box.innerHTML='';
  opts.forEach(function(o){
    var b=document.createElement('div');
    b.className='gopt';
    b.textContent=o.en;
    b.addEventListener('click',function(){
      if(b.classList.contains('right')||b.classList.contains('wrong'))return;
      if(o.en===correct.en){
        b.classList.add('right');
        state.lgScore++;save();
        document.getElementById('lgFb').textContent='✅ Correct! '+correct.en+' = '+correct.cn;
        document.getElementById('lgFb').className='game-fb good';
        document.getElementById('lgScore').textContent='得分: '+state.lgScore;
        document.getElementById('lgNext').style.display='block';
      }else{
        b.classList.add('wrong');
        document.getElementById('lgFb').textContent='❌ 再试试！正确答案是 '+correct.en;
        document.getElementById('lgFb').className='game-fb bad';
        // Highlight correct
        box.querySelectorAll('.gopt').forEach(function(g){if(g.textContent===correct.en)g.classList.add('right');});
        document.getElementById('lgNext').style.display='block';
      }
      renderProgress();
    });
    box.appendChild(b);
  });
  document.getElementById('lgFb').textContent='';
  document.getElementById('lgNext').style.display='none';
}

/* === Game 2: Listen, pick image === */
function pgNewQ(){
  var m=curMod();
  var pool=m.vocab.slice();
  if(pool.length<2)return;
  var correct=pool[Math.floor(Math.random()*pool.length)];
  var wrongs=pool.filter(function(v){return v.en!==correct.en;}).sort(function(){return Math.random()-0.5;}).slice(0,3);
  if(wrongs.length<3){
    var extra=[];
    MODULES.forEach(function(mod){if(mod===m)return;mod.vocab.forEach(function(v){extra.push(v);});});
    extra=extra.sort(function(){return Math.random()-0.5;});
    while(wrongs.length<3&&extra.length>0)wrongs.push(extra.shift());
  }
  var opts=[correct].concat(wrongs).sort(function(){return Math.random()-0.5;});
  document.getElementById('pgQ').textContent='听发音，选出对应的图片';
  var box=document.getElementById('pgOpts');
  box.innerHTML='';
  opts.forEach(function(o){
    var b=document.createElement('div');
    b.className='gopt';
    b.innerHTML='<span style="font-size:32px">'+o.em+'</span>';
    b.addEventListener('click',function(){
      if(b.classList.contains('right')||b.classList.contains('wrong'))return;
      if(o.en===correct.en){
        b.classList.add('right');
        state.pgScore++;save();
        document.getElementById('pgFb').textContent='✅ Correct! '+correct.en+' = '+correct.cn;
        document.getElementById('pgFb').className='game-fb good';
        document.getElementById('pgScore').textContent='得分: '+state.pgScore;
        document.getElementById('pgNext').style.display='block';
      }else{
        b.classList.add('wrong');
        document.getElementById('pgFb').textContent='❌ 再试试！正确答案是 '+correct.em;
        document.getElementById('pgFb').className='game-fb bad';
        box.querySelectorAll('.gopt').forEach(function(g){if(g.innerHTML.indexOf(correct.em)>=0)g.classList.add('right');});
        document.getElementById('pgNext').style.display='block';
      }
      renderProgress();
    });
    box.appendChild(b);
  });
  document.getElementById('pgFb').textContent='';
  document.getElementById('pgNext').style.display='none';
}

function renderProgress(){
  var m=curMod();
  var vocabLearned=m.vocab.filter(function(v){return state.learned.has(v.en);}).length;
  var totalVocab=m.vocab.length;
  document.getElementById('pvVocab').textContent=vocabLearned+' / '+totalVocab;
  document.getElementById('pbVocab').style.width=(totalVocab>0?(vocabLearned/totalVocab*100):0)+'%';
  var totalScore=state.lgScore+state.pgScore;
  document.getElementById('pvGame').textContent=totalScore+' 分';
  document.getElementById('pbGame').style.width=Math.min(totalScore*5,100)+'%';
  var modsWithStars=MODULES.filter(function(mod){return mod.vocab.every(function(v){return state.learned.has(v.en);});}).length;
  document.getElementById('pvMod').textContent=modsWithStars+' / '+MODULES.length;
  document.getElementById('pbMod').style.width=(modsWithStars/MODULES.length*100)+'%';
  document.getElementById('starCount').textContent='★ '+modsWithStars;
}

function renderAll(){
  renderModBar();
  renderHero();
  renderVocab();
  renderSents();
  lgNewQ();
  pgNewQ();
  renderProgress();
}

/* === Init === */
document.addEventListener('DOMContentLoaded',function(){
  renderAll();
  document.getElementById('lgNextBtn').addEventListener('click',lgNewQ);
  document.getElementById('pgNextBtn').addEventListener('click',pgNewQ);
  document.getElementById('pgPlay').addEventListener('click',function(){
    var em=document.getElementById('lgEm').textContent;
    // Find matching word
    var m=curMod();
    var found=m.vocab.find(function(v){return v.em===em;});
    if(found)speak(found.en);
  });
  // Spiral toggle
  document.getElementById('spiralBtn').addEventListener('click',function(){
    var box=document.getElementById('spiralBox');
    var frame=document.getElementById('spiralFrame');
    if(box.classList.contains('show')){
      box.classList.remove('show');
      frame.src='about:blank';
      this.textContent='🌀 展开原 3D 螺旋课节图谱';
    }else{
      box.classList.add('show');
      frame.src='spiral.html';
      this.textContent='🌀 收起 3D 螺旋';
    }
  });
});
</script>
