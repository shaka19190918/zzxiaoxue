<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6C5CE7">
<title>🦜 Polly 英语岛</title>
<style>
:root{
--pri:#6C5CE7;--pri-d:#5A4BD1;--pri-l:#EEE9FF;
--accent:#FFD93D;--accent-d:#FFA726;
--pink:#FF6B9D;--pink-l:#FFE0EC;
--teal:#4ECDC4;--teal-l:#E0F7F5;
--green:#6BCB77;--green-l:#E8F5E9;
--orange:#FF8C42;--orange-l:#FFF3E0;
--bg:#F5F2FF;--bg2:#EBE5FF;
--card:#FFF;--txt:#2D2A4A;--tx2:#8B85A8;
--good:#6BCB77;--bad:#FF6B6B;
--r:20px;--r-lg:28px;
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:200;background:linear-gradient(135deg,#6C5CE7,#8B7FF0);padding:10px 16px;padding-top:max(10px,var(--st));display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 20px rgba(108,92,231,.25)}
.hdr .back{font-size:22px;color:#FFF;text-decoration:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.hdr .back:active{background:rgba(255,255,255,.2)}
.hdr .title-box{flex:1;text-align:center}
.hdr .title-box .t1{font-size:16px;font-weight:800;color:#FFF;letter-spacing:.5px}
.hdr .title-box .t2{font-size:11px;color:rgba(255,255,255,.7)}
.hdr .stat-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:16px}
.hdr .stat-pill .ic{font-size:16px}
.hdr .stat-pill .val{font-size:14px;font-weight:800;color:#FFF}

/* ===== MAIN ===== */
.main{padding:12px 14px;padding-bottom:calc(70px+var(--sb));flex:1;position:relative}

/* ===== MASCOT ===== */
.mascot-bar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--pri-l),#FFF);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:2px solid rgba(108,92,231,.12);position:relative;overflow:hidden}
.mascot-bar::after{content:'';position:absolute;right:-30px;bottom:-30px;width:80px;height:80px;border-radius:50%;background:rgba(108,92,231,.05)}
.mascot-av{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}
.mascot-av .mascot-bounce{display:inline-block;animation:mascotBounce 2s ease-in-out infinite}
@keyframes mascotBounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.mascot-msg{flex:1;font-size:13px;line-height:1.5;color:var(--txt)}
.mascot-msg b{color:var(--pri-d)}
.mascot-msg .streak-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#FF8C42,#FFD93D);color:#FFF;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:800;margin-left:6px}
.mascot-msg .streak-badge .fire{font-size:14px}

/* ===== ISLAND CARDS (Module Selector) ===== */
.islands{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.island{border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:3px solid transparent;position:relative;overflow:hidden}
.island:active{transform:scale(.93)}
.island.on{border-color:#FFF;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.island .il-em{font-size:28px;display:block;margin-bottom:4px;line-height:1}
.island .il-nm{font-size:11px;font-weight:800}
.island .il-ck{position:absolute;top:4px;right:4px;font-size:14px;opacity:0;transition:opacity .2s}
.island.done .il-ck{opacity:1}
.island .il-prog{height:4px;border-radius:2px;margin-top:6px;background:rgba(0,0,0,.1);overflow:hidden}
.island .il-prog span{display:block;height:100%;background:#FFF;border-radius:2px;transition:width .3s}

/* ===== HERO (Module Title) ===== */
.hero{border-radius:var(--r-lg);padding:18px 20px;color:#FFF;margin-bottom:14px;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px}
.hero h2{font-size:18px;font-weight:800;margin-bottom:4px;position:relative;z-index:1}
.hero p{font-size:12px;opacity:.9;position:relative;z-index:1}
.hero .h-em{font-size:44px;flex-shrink:0;position:relative;z-index:1;animation:heroBounce 3s ease-in-out infinite}
@keyframes heroBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1) rotate(5deg)}}

/* ===== SECTION TITLE ===== */
.sect-t{font-size:15px;font-weight:800;color:var(--txt);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sect-t .ic{font-size:20px}
.sect-t .hint{font-size:12px;color:var(--tx2);font-weight:400;margin-left:auto}

/* ===== VOCAB CARDS ===== */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.vc{background:var(--card);border-radius:18px;padding:16px 10px 12px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:3px solid transparent;box-shadow:0 3px 12px rgba(0,0,0,.06);position:relative}
.vc:active{transform:scale(.92)}
.vc.playing{border-color:var(--pri);background:var(--pri-l);box-shadow:0 6px 20px rgba(108,92,231,.25);transform:scale(1.03)}
.vc.learned::after{content:'⭐';position:absolute;top:6px;right:8px;font-size:14px;animation:starPop .4s ease}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.vc .vc-em{font-size:42px;line-height:1;margin-bottom:8px;transition:transform .2s}
.vc:active .vc-em{transform:scale(1.15)}
.vc .vc-en{font-size:17px;font-weight:800;color:var(--pri-d)}
.vc .vc-cn{font-size:12px;color:var(--tx2);margin-top:2px}
.vc .vc-spk{width:28px;height:28px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:14px;margin:6px auto 0;transition:background .15s}
.vc.playing .vc-spk{background:var(--pri);color:#FFF;animation:speakerPulse .8s ease-in-out infinite}
@keyframes speakerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* ===== SENTENCE CARDS ===== */
.sent-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sc{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s}
.sc:active{transform:scale(.97)}
.sc.playing{box-shadow:0 6px 20px rgba(108,92,231,.2);background:var(--pri-l);transform:scale(1.01)}
.sc .sc-ic{font-size:28px;flex-shrink:0;width:40px;text-align:center}
.sc .sc-text{flex:1}
.sc .sc-en{font-size:16px;font-weight:700;color:var(--txt)}
.sc .sc-cn{font-size:12px;color:var(--tx2);margin-top:2px}
.sc .sc-spk{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:transform .15s;box-shadow:0 3px 10px rgba(108,92,231,.25)}
.sc.playing .sc-spk{animation:speakerPulse .8s ease-in-out infinite}

/* ===== GAME BOX ===== */
.game-box{background:var(--card);border-radius:var(--r-lg);padding:20px 18px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:14px;position:relative;overflow:hidden}
.game-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.game-box.lg::before{background:linear-gradient(90deg,var(--teal),var(--green))}
.game-box.pg::before{background:linear-gradient(90deg,var(--pink),var(--accent))}
.game-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.game-hd h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.game-hd .score-box{display:flex;align-items:center;gap:8px}
.game-hd .score-box .stars{font-size:18px}
.game-hd .score-box .score-val{font-size:16px;font-weight:800;color:var(--accent-d)}
.game-hd .streak-box{display:flex;align-items:center;gap:3px;background:linear-gradient(135deg,#FF8C42,#FFD93D);padding:3px 10px;border-radius:12px;color:#FFF;font-size:13px;font-weight:800}
.game-hd .streak-box .fire{font-size:15px}
.game-hd .streak-box.zero{background:#E0E0E0;color:#999}

.game-q{font-size:16px;font-weight:700;text-align:center;margin-bottom:16px;color:var(--txt)}
.game-q .big-em{font-size:72px;display:block;margin-bottom:8px;line-height:1;animation:emPop .4s ease}
@keyframes emPop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.game-q .q-text{font-size:15px;color:var(--tx2)}

.game-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gopt{padding:18px 10px;border-radius:16px;border:3px solid #E8E4F0;background:#FFF;font-size:17px;font-weight:800;cursor:pointer;text-align:center;transition:all .15s;min-height:68px;display:flex;align-items:center;justify-content:center;position:relative}
.gopt:active{transform:scale(.92)}
.gopt .gopt-em{font-size:36px;display:block;margin-bottom:2px}
.gopt.right{background:linear-gradient(135deg,#6BCB77,#4CAF50);color:#FFF;border-color:transparent;animation:correctPop .4s ease}
.gopt.wrong{background:linear-gradient(135deg,#FFCDD2,#FF8A80);color:#C62828;border-color:transparent;animation:wrongShake .4s ease}
@keyframes correctPop{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(1.06) rotate(3deg)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.game-fb{text-align:center;font-size:15px;font-weight:700;margin-top:12px;min-height:24px;display:flex;align-items:center;justify-content:center;gap:6px}
.game-fb.good{color:var(--good)}
.game-fb.bad{color:var(--bad)}
.game-fb.neutral{color:var(--tx2)}
.game-fb .fb-em{font-size:22px}

.game-next{margin-top:12px;text-align:center}
.btn-next{display:inline-block;padding:12px 32px;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#FFF;font-size:15px;font-weight:700;cursor:pointer;border:none;box-shadow:0 4px 14px rgba(108,92,231,.3);transition:transform .15s}
.btn-next:active{transform:scale(.93)}

/* Listen game play button */
.lg-play{margin:0 auto 14px;width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--accent));color:#FFF;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;box-shadow:0 8px 24px rgba(255,107,157,.3);transition:transform .15s}
.lg-play:active{transform:scale(.88)}
.lg-play.playing{animation:playPulse 1s ease-in-out infinite}
@keyframes playPulse{0%,100%{box-shadow:0 8px 24px rgba(255,107,157,.3);transform:scale(1)}50%{box-shadow:0 8px 36px rgba(255,107,157,.55);transform:scale(1.05)}}

/* ===== CONFETTI ===== */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:14px;animation:confettiFall 1.2s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0) scale(1);opacity:1}100%{transform:translateY(400px) rotate(720deg) scale(.5);opacity:0}}

/* ===== STAR COLLECTOR (Progress) ===== */
.star-box{background:linear-gradient(135deg,var(--pri-l),#FFF);border-radius:var(--r-lg);padding:18px 16px;box-shadow:0 4px 14px rgba(0,0,0,.05);margin-bottom:14px;border:2px solid rgba(108,92,231,.08)}
.star-box h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.star-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.star-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .2s;background:rgba(0,0,0,.04)}
.star-cell.earned{background:linear-gradient(135deg,var(--accent),var(--accent-d));animation:starEarn .5s ease}
.star-cell.locked{opacity:.3}
@keyframes starEarn{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.star-stats{display:flex;justify-content:space-around;text-align:center}
.star-stats .ss-item .ss-val{font-size:22px;font-weight:800;color:var(--pri-d)}
.star-stats .ss-item .ss-lbl{font-size:11px;color:var(--tx2);margin-top:2px}

/* ===== SPIRAL ===== */
.spiral-toggle{text-align:center;margin:14px 0}
.btn-spiral{display:inline-block;padding:10px 24px;border-radius:14px;background:#FFF;border:2px solid var(--pri);color:var(--pri-d);font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn-spiral:active{transform:scale(.93)}
#spiralBox{display:none;margin-bottom:14px;border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#spiralBox.show{display:block}
#spiralFrame{width:100%;height:420px;border:none}

/* ===== NAV LINKS ===== */
.nav-links{display:flex;gap:8px;margin-bottom:12px}
.nav-links a{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:var(--card);font-size:12px;font-weight:700;text-decoration:none;color:var(--pri-d);box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .15s}
.nav-links a:active{transform:scale(.93)}

/* ===== RESPONSIVE ===== */
@media(max-width:700px){.vocab-grid{grid-template-columns:repeat(2,1fr)}.game-opts{grid-template-columns:repeat(2,1fr)}#app{max-width:100%}.hdr .title-box .t1{font-size:14px}.islands{grid-template-columns:repeat(3,1fr)}.star-grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:701px){.vocab-grid{grid-template-columns:repeat(4,1fr)}.game-opts{grid-template-columns:repeat(4,1fr)}.islands{grid-template-columns:repeat(6,1fr)}}
@media(orientation:landscape) and (max-height:560px){
:root{--r:16px;--r-lg:22px}
.hero{padding:12px 16px}.hero h2{font-size:16px}.hero .h-em{font-size:32px}.hero p{font-size:11px}
.vc{padding:12px 8px 10px}.vc .vc-em{font-size:32px}.vc .vc-en{font-size:15px}
#spiralFrame{height:280px}.hdr{padding:6px 14px}.hdr .title-box .t1{font-size:14px}.main{padding:8px 12px;padding-bottom:40px}
.mascot-bar{padding:8px 12px}.mascot-av{width:40px;height:40px;font-size:28px}.mascot-msg{font-size:12px}
.game-box{padding:14px 12px}.game-q .big-em{font-size:48px}.gopt{min-height:54px;font-size:15px;padding:12px 8px}.gopt .gopt-em{font-size:28px}
.islands{gap:6px}.island{padding:8px 6px}.island .il-em{font-size:22px}
}
</style>
</head>

var MODULES=[

/* === STATE === */
var state={modIdx:0,learned:new Set(),lgScore:0,pgScore:0,lgStreak:0,pgStreak:0,lgAnswered:0,pgAnswered:0};
try{var s=JSON.parse(localStorage.getItem('polly_english_v3')||'{}');
if(s.modIdx!==undefined)state.modIdx=s.modIdx;
if(s.learned)state.learned=new Set(s.learned);
if(s.lgScore)state.lgScore=s.lgScore;
if(s.pgScore)state.pgScore=s.pgScore;
}catch(e){}
function save(){try{localStorage.setItem('polly_english_v3',JSON.stringify({modIdx:state.modIdx,learned:[...state.learned],lgScore:state.lgScore,pgScore:state.pgScore}));}catch(e){}}

/* === TTS === */
var synth=window.speechSynthesis||null;
function speak(text,lang){
if(!synth)return;
try{synth.cancel()}catch(e){}
var u=new SpeechSynthesisUtterance(text);
u.lang=lang||'en-US';u.rate=0.75;u.pitch=1.15;
synth.speak(u);
}

/* === SOUND EFFECTS (Web Audio API) === */
var audioCtx=null;
function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return audioCtx;}
function playTone(freq,dur,type){var ctx=ensureAudio();if(!ctx)return;var o=ctx.createOscillator();var g=ctx.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(0.15,ctx.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);}
function sfxCorrect(){playTone(523,0.12,'sine');setTimeout(function(){playTone(659,0.12,'sine');},100);setTimeout(function(){playTone(784,0.2,'sine');},200);}
function sfxWrong(){playTone(220,0.15,'sawtooth');setTimeout(function(){playTone(180,0.2,'sawtooth');},120);}
function sfxStar(){playTone(880,0.08,'triangle');setTimeout(function(){playTone(1047,0.12,'triangle');},80);}

/* === CONFETTI === */
function confetti(){
var layer=document.getElementById('confettiLayer');
var colors=['#FF6B6B','#4ECDC4','#FFD93D','#6C5CE7','#6BCB77','#FF8C42','#FF6B9D'];
for(var i=0;i<24;i++){
var p=document.createElement('div');
p.className='confetti-piece';
p.style.left=(Math.random()*100)+'%';
p.style.top='40%';
p.style.background=colors[Math.floor(Math.random()*colors.length)];
p.style.borderRadius=Math.random()>0.5?'50%':'2px';
p.style.width=(6+Math.random()*8)+'px';
p.style.height=(8+Math.random()*12)+'px';
p.style.animationDelay=(Math.random()*0.15)+'s';
p.style.animationDuration=(0.8+Math.random()*0.6)+'s';
layer.appendChild(p);
setTimeout(function(el){el.remove();},1500);
}
}

/* === RENDER === */
function curMod(){return MODULES[state.modIdx];}

function mascotMsg(key,vars){
var msg=MASCOT_MSGS[key]||key;
if(vars)Object.keys(vars).forEach(function(k){msg=msg.replace('{'+k+'}',vars[k]);});
document.getElementById('mascotMsg').innerHTML=msg;
}

function renderIslands(){
var box=document.getElementById('islands');
box.innerHTML='';
MODULES.forEach(function(m,i){
var learned=m.vocab.filter(function(v){return state.learned.has(v.en);}).length;
var total=m.vocab.length;
var pct=Math.round(learned/total*100);
var el=document.createElement('div');
el.className='island'+(i===state.modIdx?' on':'')+(learned>=total?' done':'');
el.style.background=i===state.modIdx?'linear-gradient(135deg,'+m.color+','+m.color+'cc)':'#FFF';
if(i===state.modIdx){el.style.color='#FFF';}else{el.style.color='var(--tx2)';}
el.innerHTML='<span class="il-ck">✅</span><span class="il-em">'+m.emoji+'</span><div class="il-nm">'+m.name.replace('Module ','M')+'</div><div class="il-prog"><span style="width:'+pct+'%"></span></div>';
el.addEventListener('click',function(){
state.modIdx=i;save();
mascotMsg('start',{title:m.title});
renderAll();
});
box.appendChild(el);
});
}

function renderVocab(){
var m=curMod();
var grid=document.getElementById('vocabGrid');
grid.innerHTML='';
var allLearned=true;
m.vocab.forEach(function(v){
var c=document.createElement('div');
c.className='vc'+(state.learned.has(v.en)?' learned':'');
c.innerHTML='<div class="vc-em">'+v.em+'</div><div class="vc-en">'+v.en+'</div><div class="vc-cn">'+v.cn+'</div><div class="vc-spk">🔊</div>';
c.addEventListener('click',function(){
document.querySelectorAll('.vc.playing').forEach(function(el){el.classList.remove('playing');});
c.classList.add('playing');
speak(v.en);
sfxStar();
var wasNew=!state.learned.has(v.en);
state.learned.add(v.en);
save();
if(wasNew){
c.classList.add('learned');
mascotMsg('vocab',{en:v.en});
}
setTimeout(function(){c.classList.remove('playing');},1500);
renderProgress();
renderIslands();
});
grid.appendChild(c);
if(!state.learned.has(v.en))allLearned=false;
});
if(allLearned&&m.vocab.length>0){
setTimeout(function(){mascotMsg('vocabDone');},100);
}
}

/* GAME 1: See image, pick English word */
function lgNewQ(){
var m=curMod();
var pool=m.vocab.slice();
if(pool.length<2)return;
var correct=pool[Math.floor(Math.random()*pool.length)];
var wrongs=pool.filter(function(v){return v.en!==correct.en;}).sort(function(){return Math.random()-0.5;}).slice(0,3);
if(wrongs.length<3){
var extra=[];
MODULES.forEach(function(mod){if(mod===m)return;mod.vocab.forEach(function(v){if(pool.indexOf(v)<0)extra.push(v);});});
extra=extra.sort(function(){return Math.random()-0.5;});
while(wrongs.length<3&&extra.length>0)wrongs.push(extra.shift());
}
var opts=[correct].concat(wrongs).sort(function(){return Math.random()-0.5;});
document.getElementById('lgEm').textContent=correct.em;
document.getElementById('lgQ').innerHTML='<span class="big-em">'+correct.em+'</span><span class="q-text">这是哪个单词？</span>';
speak(correct.en);
var box=document.getElementById('lgOpts');
box.innerHTML='';
opts.forEach(function(o){
var b=document.createElement('div');
b.className='gopt';
b.textContent=o.en;
b.addEventListener('click',function(){
if(b.classList.contains('right')||b.classList.contains('wrong'))return;
state.lgAnswered++;
if(o.en===correct.en){
b.classList.add('right');
state.lgScore++;state.lgStreak++;save();
sfxCorrect();confetti();
var fb=document.getElementById('lgFb');
fb.className='game-fb good';
fb.innerHTML='<span class="fb-em">🎉</span> 太棒了！'+correct.en+' = '+correct.cn;
document.getElementById('lgScore').textContent=state.lgScore;
updateStreak('lg',state.lgStreak);
if(state.lgStreak>=5)mascotMsg('streak5');
else if(state.lgStreak>=3)mascotMsg('streak3');
else mascotMsg('gameRight',{streak:state.lgStreak});
document.getElementById('lgNext').style.display='block';
}else{
b.classList.add('wrong');state.lgStreak=0;save();
sfxWrong();
document.getElementById('lgFb').className='game-fb bad';
document.getElementById('lgFb').innerHTML='<span class="fb-em">💪</span> 没关系！正确答案是 '+correct.en+' ('+correct.cn+')';
updateStreak('lg',0);
mascotMsg('gameWrong');
box.querySelectorAll('.gopt').forEach(function(g){if(g.textContent===correct.en)g.classList.add('right');});
document.getElementById('lgNext').style.display='block';
}
renderProgress();
});
box.appendChild(b);
});
document.getElementById('lgFb').className='game-fb neutral';
document.getElementById('lgFb').innerHTML='<span class="fb-em">🎯</span> 选一个答案吧！';
document.getElementById('lgNext').style.display='none';
}

function renderProgress(){
var m=curMod();
var vocabLearned=m.vocab.filter(function(v){return state.learned.has(v.en);}).length;
var totalVocab=m.vocab.length;
var totalLearned=0,totalVocabAll=0;
MODULES.forEach(function(mod){totalVocabAll+=mod.vocab.length;mod.vocab.forEach(function(v){if(state.learned.has(v.en))totalLearned++;});});
var totalScore=state.lgScore+state.pgScore;
var modsWithStars=MODULES.filter(function(mod){return mod.vocab.every(function(v){return state.learned.has(v.en);});}).length;

/* Star grid */
var grid=document.getElementById('starGrid');
grid.innerHTML='';
var totalStars=totalVocabAll;
for(var i=0;i<totalStars;i++){
var cell=document.createElement('div');
cell.className=i<totalLearned?'star-cell earned':'star-cell locked';
cell.textContent=i<totalLearned?'⭐':'🔒';
grid.appendChild(cell);
}

document.getElementById('ssVocab').textContent=totalLearned;
document.getElementById('ssGame').textContent=totalScore;
document.getElementById('ssMod').textContent=modsWithStars+'/'+MODULES.length;
document.getElementById('totalStars').textContent=totalLearned;

if(modsWithStars>=MODULES.length){
setTimeout(function(){mascotMsg('allDone');},200);
}
}

function renderAll(){
renderIslands();
renderHero();
renderVocab();
renderSents();
lgNewQ();
pgNewQ();
renderProgress();
}

/* INIT */
document.addEventListener('DOMContentLoaded',function(){
renderAll();
document.getElementById('lgNextBtn').addEventListener('click',lgNewQ);
document.getElementById('pgNextBtn').addEventListener('click',pgNewQ);
document.getElementById('pgPlay').addEventListener('click',function(){
var playBtn=document.getElementById('pgPlay');
playBtn.classList.add('playing');
if(state._pgCorrect)speak(state._pgCorrect.en);
setTimeout(function(){playBtn.classList.remove('playing');},1500);
});
document.getElementById('spiralBtn').addEventListener('click',function(){
var box=document.getElementById('spiralBox');
var frame=document.getElementById('spiralFrame');
if(box.classList.contains('show')){
box.classList.remove('show');
frame.src='about:blank';
this.textContent='🌀 展开原 3D 螺旋课节图谱';
}else{
box.classList.add('show');
frame.src='spiral.html';
this.textContent='🌀 收起 3D 螺旋';
}
});
/* Resume audio context on first interaction */
document.addEventListener('touchstart',function(){ensureAudio();},{once:true});
document.addEventListener('click',function(){ensureAudio();},{once:true});
});
</script>
</body>
</html>
